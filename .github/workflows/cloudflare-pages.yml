name: Cloudflare Pages

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-pages.yml"
      - "webapp/.env.production"
      - "webapp/frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-pages.yml"
      - "webapp/.env.production"
      - "webapp/frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Validate and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          workingDirectory: webapp/frontend
          command: pages deploy dist --project-name=human-vs-ai --branch=main

      - name: Verify production site
        if: github.event_name != 'pull_request'
        run: >-
          curl --fail --show-error --silent
          --retry 5 --retry-all-errors --retry-delay 3
          https://human-vs-ai-ce2.pages.dev/
          > /dev/null